<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | SmartLib</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login" class="login-page">
    <main class="login-card">
        <span class="brand-mark" aria-hidden="true">S</span>
        <p class="eyebrow">SmartLib</p>
        <h1 class="form-title">Acessar a biblioteca</h1>
        <p class="form-description">Entre com sua conta para acessar os recursos do seu perfil.</p>
        <form id="login-form" class="form-stack">
            <div class="field"><label for="login-email">E-mail</label><input id="login-email" type="email" autocomplete="username" required></div>
            <div class="field"><label for="login-password">Senha</label><input id="login-password" type="password" autocomplete="current-password" required></div>
            <button class="primary-action" type="submit">Entrar</button>
        </form>
    </main>
    <script src="app.js" defer></script>
</body>
</html>
